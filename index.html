<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekomendasi Tempat Kerja Buat Kamu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f4f7fb;
    color: #1e293b;
    line-height: 1.6;
  }

  /* HEADLINE & SUBLINE */
  .header-section {
    text-align: center;
    padding: 60px 20px 40px;
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
  }
  .header-section h1 {
    font-size: 2.2rem;
    font-weight: 700;
    color: #1e3a8a;
    margin-bottom: 8px;
  }
  .header-section p {
    font-size: 1.05rem;
    color: #64748b;
  }

  /* CONTAINER LIST */
  .container {
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* KARTU LIST */
  .list-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px 24px;
    box-shadow: 0 2px 10px rgba(30, 58, 138, 0.05);
    border: 1px solid #e2e8f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    transition: transform 0.2s ease;
  }
  .list-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(30, 58, 138, 0.1);
  }

  /* BAGIAN KIRI (Teks) */
  .card-left {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .card-left h3 {
    font-size: 1.25rem;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 4px;
  }
  .card-left .role {
    font-size: 0.95rem;
    color: #64748b;
    margin-bottom: 16px;
  }
  
  /* TOMBOL LINK */
  .btn-link {
    display: inline-block;
    text-decoration: none;
    color: #2563eb;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 8px 16px;
    border: 1.5px solid #2563eb;
    border-radius: 6px;
    transition: all 0.2s ease;
  }
  .btn-link:hover {
    background: #2563eb;
    color: #fff;
  }

  /* BAGIAN KANAN (Foto) */
  .card-right {
    width: 120px;
    height: 120px;
    flex-shrink: 0;
    border-radius: 8px;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-right img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* object-fit: contain; -> pakai ini kalau gambarnya logo dan gak mau kepotong */
  }
  .card-right .placeholder-text {
    font-size: 0.8rem;
    color: #94a3b8;
    text-align: center;
    padding: 10px;
    font-weight: 600;
  }

  /* RESPONSIVE (Buat HP) */
  @media (max-width: 600px) {
    .header-section h1 { font-size: 1.8rem; }
    .list-card {
      flex-direction: column-reverse; /* Di HP, foto pindah ke atas teks */
      align-items: flex-start;
      gap: 16px;
    }
    .card-right {
      width: 100%;
      height: 160px;
    }
    .btn-link {
      width: 100%;
      text-align: center;
    }
  }
</style>
</head>
<body>

  <!-- HEADLINE & SUBLINE -->
  <header class="header-section">
    <h1>Rekomendasi Tempat Kerja</h1>
    <p>Kurasi tempat kerja impian berdasarkan lingkungan dan budaya yang suportif.</p>
  </header>

  <div class="container">

    <!-- CARD 1 -->
    <div class="list-card">
      <div class="card-left">
        <h3>PT Contoh Teknologi</h3>
        <div class="role">Bidang: Software Engineer</div>
        <a href="https://contoh.com/karier" class="btn-link" target="_blank">Link Rekrutmen →</a>
      </div>
      <div class="card-right">
        <!-- Ganti src dengan link gambar asli -->
        <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Foto PT Contoh Teknologi">
      </div>
    </div>

    <!-- CARD 2 -->
    <div class="list-card">
      <div class="card-left">
        <h3>Startup Contoh Digital</h3>
        <div class="role">Bidang: UI/UX Designer</div>
        <a href="https://contoh.com/karier" class="btn-link" target="_blank">Link Rekrutmen →</a>
      </div>
      <div class="card-right">
        <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Foto Startup Contoh">
      </div>
    </div>

    <!-- CARD 3 -->
    <div class="list-card">
      <div class="card-left">
        <h3>Bank Contoh Indonesia</h3>
        <div class="role">Bidang: Data Analyst</div>
        <a href="https://contoh.com/karier" class="btn-link" target="_blank">Link Rekrutmen →</a>
      </div>
      <div class="card-right">
        <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Foto Bank Contoh">
      </div>
    </div>

  </div>

</body>
</html>
