<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekomendasi Tempat Kerja Buat Kamu</title>
<style>
  /* PALET WARNA BARU:
     Biru Tegas: #008ae6
     Biru Muda: #d4ebf2
     Hijau Toska: #188b8e
     Emas: #dca662
  */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #d4ebf2; /* Biru Muda */
    color: #1e293b;
    line-height: 1.6;
  }

  /* HEADLINE & SUBLINE */
  .header-section {
    text-align: center;
    padding: 60px 20px 40px;
    background: #188b8e; /* Hijau Toska */
    color: #ffffff;
    border-bottom: 4px solid #dca662; /* Garis aksen Emas */
  }
  .header-section h1 {
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .header-section p {
    font-size: 1.05rem;
    color: #e2f1f5; /* Biru sangat muda untuk teks subline */
  }

  /* CONTAINER LIST */
  .container {
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* KARTU LIST */
  .list-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 20px 24px;
    box-shadow: 0 4px 15px rgba(24, 139, 142, 0.08); /* Shadow toska tipis */
    border: 1px solid #b8dde6;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .list-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0, 138, 230, 0.15);
    border-color: #008ae6; /* Border jadi biru tegas saat di-hover */
  }

  /* BAGIAN KIRI (Teks) */
  .card-left {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .card-left h3 {
    font-size: 1.25rem;
    font-weight: 700;
    color: #008ae6; /* Nama PT pakai Biru Tegas */
    margin-bottom: 4px;
  }
  .card-left .role {
    font-size: 0.95rem;
    color: #475569;
    margin-bottom: 16px;
  }
  
  /* TOMBOL LINK */
  .btn-link {
    display: inline-block;
    text-decoration: none;
    color: #008ae6; /* Teks tombol Biru Tegas */
    font-weight: 600;
    font-size: 0.85rem;
    padding: 8px 16px;
    border: 2px solid #008ae6;
    border-radius: 6px;
    transition: all 0.3s ease;
  }
  .btn-link:hover {
    background: #dca662; /* Berubah jadi Emas saat di-hover */
    border-color: #dca662;
    color: #ffffff;
  }

  /* BAGIAN KANAN (Foto) */
  .card-right {
    width: 120px;
    height: 120px;
    flex-shrink: 0;
    border-radius: 8px;
    background: #d4ebf2;
    border: 1px solid #b8dde6;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-right img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* RESPONSIVE (Buat HP) */
  @media (max-width: 600px) {
    .header-section h1 { font-size: 1.8rem; }
    .list-card {
      flex-direction: column-reverse;
      align-items: flex-start;
      gap: 16px;
    }
    .card-right {
      width: 100%;
      height: 160px;
    }
    .btn-link {
      width: 100%;
      text-align: center;
    }
  }
</style>
</head>
<body>

  <!-- HEADLINE & SUBLINE -->
  <header class="header-section">
    <h1>Rekomendasi Tempat Kerja</h1>
    <p>Kurasi tempat kerja impian berdasarkan lingkungan dan budaya yang suportif.</p>
  </header>

  <div class="container">

    <!-- CARD 1 -->
    <div class="list-card">
      <div class="card-left">
        <h3>PT Contoh Teknologi</h3>
        <div class="role">Bidang: Software Engineer</div>
        <a href="https://contoh.com/karier" class="btn-link" target="_blank">Link Rekrutmen →</a>
      </div>
      <div class="card-right">
        <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Foto PT Contoh Teknologi">
      </div>
    </div>

    <!-- CARD 2 -->
    <div class="list-card">
      <div class="card-left">
        <h3>Startup Contoh Digital</h3>
        <div class="role">Bidang: UI/UX Designer</div>
        <a href="https://contoh.com/karier" class="btn-link" target="_blank">Link Rekrutmen →</a>
      </div>
      <div class="card-right">
        <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Foto Startup Contoh">
      </div>
    </div>

    <!-- CARD 3 -->
    <div class="list-card">
      <div class="card-left">
        <h3>Bank Contoh Indonesia</h3>
        <div class="role">Bidang: Data Analyst</div>
        <a href="https://contoh.com/karier" class="btn-link" target="_blank">Link Rekrutmen →</a>
      </div>
      <div class="card-right">
        <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Foto Bank Contoh">
      </div>
    </div>

  </div>

</body>
</html>
